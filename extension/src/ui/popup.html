<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch trình cá nhân</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="popup-body">
    <div class="popup">
      <header class="popup__head">
        <span class="brand__mark">▦</span>
        <div>
          <h1>Lịch trình cá nhân</h1>
          <p>Đọc trang · tạo sự kiện thủ công</p>
        </div>
      </header>

      <p id="popup-status" class="popup__status">Đang kiểm tra tab…</p>

      <button type="button" id="scan" class="btn btn--primary popup__scan">
        <span>Quét trang đang mở</span>
      </button>
      <button type="button" id="open-panel" class="btn btn--secondary">Mở bảng điều khiển</button>

      <p class="popup__hint">Chỉ đọc khi bạn bấm. Nội dung lưu cục bộ, không gửi đi đâu.</p>

      <footer class="popup__foot">
        <span id="popup-counts">—</span>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
